name: Task foundation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  task-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/task-data.cjs tests/task-engine.cjs
      - run: node tests/task-reminders.cjs
      - run: node --check js/weekly-focus-app.js && node --check js/wf-task-data.js && node --check js/wf-task-engine.js
