<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; color: #1b1b1f; }
    doc-page:not(:defined) { visibility: hidden; }
    a { color: oklch(0.52 0.17 283); } a:hover { color: oklch(0.62 0.18 283); }
  </style>
  <script src="./doc-page.js"></script>
</helmet>
<doc-page margin="0.7in">
  <div slot="footer" style="display:flex;justify-content:space-between;font-size:8.5pt;color:#8a8a92;padding:0 0 4pt">
    <span>Trip Schedule — India → Japan</span><span>Aug–Sept 2026</span>
  </div>
  <div style="display:flex;align-items:baseline;justify-content:space-between;border-bottom:2.5pt solid #1b1b1f;padding-bottom:8pt">
    <div style="font-size:22pt;font-weight:800;letter-spacing:-0.02em">Trip Schedule<span style="color:oklch(0.55 0.16 152)">.</span></div>
    <div style="font-size:9pt;font-weight:700;letter-spacing:0.14em;color:#6b6b73;text-transform:uppercase">India → Japan · Flight ~22 Aug · Job 1 Sept</div>
  </div>
  <sc-for list="{{ legs }}" as="leg" hint-placeholder-count="2">
    <div style="{{ leg.wrapStyle }}">
      <div style="font-size:10pt;font-weight:800;letter-spacing:0.16em;text-transform:uppercase;margin:18pt 0 4pt">{{ leg.kicker }} <span style="font-weight:400;color:#8a8a92;letter-spacing:0.02em;text-transform:none">— {{ leg.sub }}</span></div>
      <sc-for list="{{ leg.groups }}" as="g" hint-placeholder-count="4">
        <div style="break-inside:avoid;margin-top:10pt">
          <div style="display:flex;align-items:baseline;gap:8pt;border-bottom:1pt solid #d8d8de;padding-bottom:3pt">
            <span style="{{ g.dateStyle }}">{{ g.date }}</span>
            <span style="font-size:11pt;font-weight:800">{{ g.title }}</span>
            <sc-if value="{{ g.sub }}" hint-placeholder-val="{{ false }}"><span style="font-size:8.5pt;color:#8a8a92">{{ g.sub }}</span></sc-if>
          </div>
          <sc-for list="{{ g.tasks }}" as="task" hint-placeholder-count="2">
            <div style="display:flex;align-items:flex-start;gap:7pt;padding:3.5pt 0 3.5pt 2pt;border-bottom:0.5pt dotted #e2e2e8;orphans:3;widows:3">
              <span style="{{ task.boxStyle }}">{{ task.tick }}</span>
              <span style="flex:1;min-width:0">
                <span style="{{ task.tStyle }}">{{ task.t }}</span>
                <sc-if value="{{ task.pri }}" hint-placeholder-val="{{ false }}"><span style="font-size:7.5pt;font-weight:800;color:#c02638;border:0.75pt solid #c02638;border-radius:3pt;padding:0.5pt 3pt;margin-left:4pt;vertical-align:1pt">URGENT</span></sc-if>
                <sc-if value="{{ task.blocked }}" hint-placeholder-val="{{ false }}"><span style="font-size:8pt;color:#946a00;margin-left:4pt">⚠ {{ task.blocked }}</span></sc-if>
                <sc-if value="{{ task.note }}" hint-placeholder-val="{{ false }}"><span style="display:block;font-size:8.5pt;color:#6b6b73;margin-top:1pt;line-height:1.4">{{ task.note }}</span></sc-if>
              </span>
            </div>
          </sc-for>
          <sc-if value="{{ g.finale }}" hint-placeholder-val="{{ false }}">
            <div style="padding:4pt 0 0 2pt;font-size:10.5pt;font-weight:800;color:oklch(0.45 0.14 152)">● {{ g.finale }}</div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-for>
</doc-page>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  data() {
    return [
      { leg: 'india', date: 'NOW', tone: 'red', title: 'Remote', sub: 'no location — time-bound', tasks: [
        { id: 'tashiro', t: 'Reply to Tashiro-san (Tajiro)', note: 'was due 9 Aug — overdue', pri: 'H' },
        { id: 'okuda', t: 'Reply from Okuda-san', note: 'urgent — no date set', pri: 'H' } ] },
      { leg: 'india', date: 'ANYTIME', tone: 'muted', title: 'Pune · Kothrud', sub: 'do whenever convenient', tasks: [
        { id: 'visim', t: 'Vi SIM — annual recharge + roaming', note: 'blocks every OTP you need', pri: 'H' },
        { id: 'sbinre', t: 'SBI NRE — document prep', note: '12-item checklist, separate board', pri: 'H' },
        { id: 'gift', t: 'Gift for Matsuyama-san & Okada-san', pri: 'H' },
        { id: 'linkedin', t: 'Refresh LinkedIn profile', note: 'before connecting recruiters' },
        { id: 'jobapp', t: 'Draft job application', note: 'before the Hadapsar meeting' },
        { id: 'intl', t: 'Enable international transactions on Indian cards' },
        { id: 'closeacc', t: 'Close dormant Bank of Maharashtra + Union Bank accounts' },
        { id: 'forex', t: 'Buy \u00a550,000\u201380,000 cash from a Pune forex dealer' },
        { id: 'hk', t: 'Hong Kong pre-arrival transit registration' },
        { id: 'licence', t: 'Two-wheeler international licence' },
        { id: 'sbicard', t: 'SBI card number link' },
        { id: 'shares', t: 'Access to add/manage shares' },
        { id: 'ytp', t: 'YouTube Premium subscription' },
        { id: 'cover', t: 'Buy mobile cover' },
        { id: 'bat', t: 'Mosquito bat' },
        { id: 'clothes', t: 'Clothes for new job', blocked: 'waiting on Akshay\u2019s dress code reply' },
        { id: 'dmart', t: 'D-Mart remaining', note: 'teapoy, bathroom + basin brush, ghee, Parle-G, Amul/Cadbury chocolate' } ] },
      { leg: 'india', date: 'SUN 9 AUG', due: '2026-08-09', title: 'D-Mart → Hadapsar', tasks: [
        { id: 'dmart830', t: 'D-Mart 8:30am — remaining items' },
        { id: 'hadapsar', t: 'Hadapsar meeting — job discussion' } ] },
      { leg: 'india', date: 'BY 14 AUG', due: '2026-08-14', title: 'Bavdhan', sub: 'weekday, before 15 Aug', tasks: [
        { id: 'bavdhan', t: 'Friend meetup' } ] },
      { leg: 'india', date: 'TRIP', tone: 'muted', title: 'SBI Malvan branch', sub: 'separate trip — hometown', tasks: [
        { id: 'nro', t: 'NRO conversion + NRE opening', pri: 'H' },
        { id: 'nredocs', t: 'Carry the full NRE document set', note: 'form, passport copies, visa, residence card, address self-declaration, Aadhaar/PAN, photos, FATCA, backup employment cert, funding plan' } ] },
      { leg: 'india', date: 'SAT 15 AUG', due: '2026-08-15', title: 'Moshi', tasks: [
        { id: 'moshi', t: 'Moshi meeting — job discussion + catch-up' } ] },
      { leg: 'india', date: '19\u201321 AUG', due: '2026-08-21', title: 'Chitale, Dahanukar Colony', sub: 'last 2\u20133 days before flight', tasks: [
        { id: 'bakarwadi', t: 'Bakarwadi \u00d73' },
        { id: 'kalakand', t: 'Kalakand' } ] },
      { leg: 'india', date: '~22 AUG', due: '2026-08-22', title: 'Flight', tasks: [
        { id: 'father', t: 'Father joining the flight?', pri: 'H', blocked: 'unresolved — cost, documents, feasibility' } ] },
      { leg: 'japan', date: 'ARRIVAL', title: 'Ichikawa city hall', sub: 'first days back in Japan', tasks: [
        { id: 'nhi', t: 'Settle outstanding NHI premiums', pri: 'H' },
        { id: 'health', t: 'Book pre-employment health check (all 11 items)', note: 'target by 24 Aug' } ] },
      { leg: 'japan', date: '~25 AUG', due: '2026-08-25', title: 'Minami-Urawa, Saitama', tasks: [
        { id: 'key', t: 'Take possession — collect the key from the mailbox' } ] },
      { leg: 'japan', date: '26\u201327 AUG', due: '2026-08-27', title: 'Saitama Minami Ward Office', tasks: [
        { id: 'tennyu', t: 'File \u8ee2\u5165\u5c4a + update \u5728\u7559\u30ab\u30fc\u30c9', note: 'bring the \u8ee2\u51fa\u8a3c\u660e\u66f8 from Ichikawa' },
        { id: 'tenkyo', t: 'Submit \u8ee2\u5c45\u5c4a — mail forwarding' } ] },
      { leg: 'japan', date: 'BY 31 AUG', due: '2026-08-31', title: 'Urban Terrace', tasks: [
        { id: 'contract', t: 'Sign & return the Urban Terrace contract' } ] },
      { leg: 'japan', date: '1 SEPT', tone: 'green', title: 'Shinjuku', finale: 'Job starts.', tasks: [] }
    ];
  }
  renderVals() {
    let done = {};
    try { done = JSON.parse(localStorage.getItem('wf-trip-done-v1')) || {}; } catch (e) {}
    const dateBase = { flex: 'none', fontSize: '8pt', fontWeight: 800, letterSpacing: '0.08em', textTransform: 'uppercase', padding: '1pt 5pt', borderRadius: '3pt', whiteSpace: 'nowrap' };
    const toneStyles = {
      red: { color: '#c02638', border: '0.75pt solid #c02638' },
      brand: { color: '#3a3a8c', border: '0.75pt solid #9a9ad0' },
      study: { color: '#0a6a7a', border: '0.75pt solid #7ab8c4' },
      muted: { color: '#6b6b73', border: '0.75pt dashed #b8b8c0' },
      green: { color: '#1e7a45', border: '0.75pt solid #1e7a45' }
    };
    const legDefs = [
      { key: 'india', kicker: 'India — Pune leg', sub: 'before the ~22 Aug flight', wrapStyle: {} },
      { key: 'japan', kicker: 'Japan — arrival leg', sub: 'landing → job start, 1 Sept', wrapStyle: { breakBefore: 'page' } }
    ];
    const legs = legDefs.map(ld => ({
      kicker: ld.kicker, sub: ld.sub, wrapStyle: ld.wrapStyle,
      groups: this.data().filter(g => g.leg === ld.key).map(g => {
        let tone = g.tone || (ld.key === 'japan' ? 'study' : 'brand');
        if (g.due && !g.finale && new Date(g.due + 'T23:59:59') < new Date()) tone = 'red';
        return {
          date: g.date, title: g.title, sub: g.sub || null, finale: g.finale || null,
          dateStyle: Object.assign({}, dateBase, toneStyles[tone]),
          tasks: g.tasks.map(t => ({
            ...t,
            tick: done[t.id] ? '✓' : '',
            pri: done[t.id] ? null : (t.pri || null),
            blocked: done[t.id] ? null : (t.blocked || null),
            boxStyle: { flex: 'none', width: '9pt', height: '9pt', border: '1pt solid #9a9aa2', borderRadius: '2pt', marginTop: '1.5pt', fontSize: '8pt', lineHeight: '9pt', textAlign: 'center', color: '#1e7a45', fontWeight: 800 },
            tStyle: done[t.id]
              ? { fontSize: '10pt', textDecoration: 'line-through', color: '#9a9aa2' }
              : { fontSize: '10pt', fontWeight: 600 }
          }))
        };
      })
    }));
    return { legs };
  }
}
</script>
</body>
</html>
